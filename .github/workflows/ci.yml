name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff and nbstripout
        run: python -m pip install ruff nbstripout
      - name: Ruff check
        run: ruff check .
      - name: Notebooks have no outputs
        run: git ls-files -z '*.ipynb' | xargs -0 nbstripout --verify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pytest
        env:
          MPLBACKEND: Agg
          PLOTLY_RENDERER: json
        run: pytest

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run notebooks
        env:
          MPLBACKEND: Agg
          PLOTLY_RENDERER: json
        run: python scripts/run_notebooks.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build and check
        run: |
          python -m build
          twine check dist/*
          python scripts/check_dist.py dist
      # Fresh venvs outside the checkout, so that imports resolve to the installed wheel.
      - name: Smoke test the wheel (core)
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_install.py" core
      - name: Smoke test the wheel ([all]) and its types
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          python -m venv "$RUNNER_TEMP/all"
          "$RUNNER_TEMP/all/bin/python" -m pip install "${wheel}[all]" mypy
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/all/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_install.py" all
          "$RUNNER_TEMP/all/bin/python" -m mypy --warn-unused-ignores "$GITHUB_WORKSPACE/scripts/smoke_typing.py"
