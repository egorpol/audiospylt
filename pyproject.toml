[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audiospylt"
version = "1.0.0.dev0"
description = "Python toolbox for sound analysis, resynthesis, and visual/symbolic representations."
authors = [{ name = "egorpol" }]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["audio", "dft", "resynthesis", "music", "mei", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy", "pandas", "requests", "scipy", "soundfile", "soxr"]

[project.optional-dependencies]
plot = ["plotly"]
# nbformat is what Plotly's fig.show() needs in Jupyter; tqdm and ipywidgets serve the 0.6 progress bar.
notebook = ["ipykernel", "ipython", "ipywidgets", "nbformat>=4.2.0", "tqdm"]
notation = ["verovio"]
librosa = ["librosa"]
all = ["audiospylt[librosa,notation,notebook,plot]"]
dev = [
  "audiospylt[all]",
  "build",
  "lxml",
  "mypy",
  "nbclient",
  "nbstripout",
  "pytest",
  "pytest-timeout",
  "ruff",
  "twine",
]

[project.urls]
Changelog = "https://github.com/egorpol/audiospylt/blob/main/CHANGELOG.md"
Repository = "https://github.com/egorpol/audiospylt"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiospylt*"]

[tool.setuptools.package-data]
audiospylt = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "-ra"
timeout = 300

[tool.ruff]
target-version = "py311"
extend-exclude = [
  "revision",
  "*.ipynb",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# imports kept so string-based patch() targets are loaded
"tests/_support.py" = ["F401"]
# sys.path is set before importing the package on purpose
"tests/golden/regenerate.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["audiospylt"]
# The 0.6 modules stay untyped until they are removed.
exclude = ['^audiospylt/(audio_utils|dft_analysis|df_transforms|f0_utils|generate_wave_file|io_utils|mei|multiplotter|plotting|plot_wave|waveform_utils)\.py$']
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# These ship no py.typed (checked 2026-10-22).
module = ["pandas", "pandas.*", "scipy", "scipy.*", "soundfile", "soxr", "plotly", "plotly.*"]
ignore_missing_imports = true
